<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vales para Blanca</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap">
<link rel="stylesheet" href="comun.css">
<style>
  .vales { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
  .vale {
    position: relative; display: flex; align-items: stretch; text-align: left;
    background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 16px; overflow: hidden;
    animation: aparecer .5s ease both;
  }
  .vale .talon {
    flex: none; width: 70px; display: grid; place-items: center; font-size: 2rem;
    background: var(--azul-hondo); border-right: 2px dashed var(--linea);
  }
  .vale .cuerpo { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .vale small { letter-spacing: .14em; text-transform: uppercase; color: var(--peonia); font-weight: 600; font-size: .72rem; }
  .vale b { font-size: 1.05rem; line-height: 1.3; }
  .vale button {
    align-self: flex-start; margin-top: 4px; border: 1px solid var(--azul); background: transparent; color: var(--azul-suave);
    font: 600 .9rem var(--cuerpo); padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .vale button:hover { background: var(--azul); color: #fff; }
  .vale.usado { opacity: .55; }
  .vale.usado .talon { filter: grayscale(1); }
  .sello {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%) rotate(-14deg);
    border: 3px solid var(--peonia); color: var(--peonia); font-weight: 700; letter-spacing: .1em;
    padding: 4px 10px; border-radius: 8px; font-size: .9rem; animation: sellar .4s ease both;
  }
  @keyframes sellar { from { transform: translateY(-50%) rotate(-14deg) scale(2.5); opacity: 0; } }
  .fondo {
    position: fixed; inset: 0; background: rgba(3,5,10,.8); z-index: 20;
    display: grid; place-items: center; padding: 16px;
  }
  .confirmar { max-width: 380px; animation: aparecer .3s ease both; display: flex; flex-direction: column; gap: 14px; }
  .confirmar .acciones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .nota { color: var(--texto-suave); font-size: .92rem; line-height: 1.5; max-width: 40ch; }
</style>
</head>
<body>
<main>
  <h1>Tus vales</h1>
  <p class="sub">Cada vale es una promesa. Canjéalo cuando quieras, mándame captura y yo te cumplo 🎟️</p>
  <div class="vales" id="vales"></div>
  <p class="nota">Los vales canjeados se quedan marcados en este celular. ¿Te equivocaste? Mantén presionado un vale usado para reactivarlo.</p>
  <a class="volver" href="sorpresas.html">← Más sorpresas</a>
</main>

<div class="fondo" id="fondo" hidden>
  <div class="panel confirmar" role="dialog" aria-modal="true" aria-labelledby="cTitulo">
    <h2 id="cTitulo">¿Canjear este vale?</h2>
    <p id="cTexto"></p>
    <div class="acciones">
      <button class="btn" id="cSi">Sí, lo quiero 💙</button>
      <button class="btn gris" id="cNo">Todavía no</button>
    </div>
  </div>
</div>

<script>
  // ✏️ Personaliza aquí
  const VALES = [
    ['🍽️', 'Una cena en un restaurante', 'Tú eliges el lugar'],
    ['⛪', 'Un viaje a Puebla', 'Tú y yo conociendo Puebla'],
    ['🏖️', 'Un día de playa', 'Sol, mar y tú'],
    ['🎬', 'Noche de películas (sin Gregory 😂)', 'Tú eliges la película, yo las botanas'],
    ['🤗', 'Un abrazo de 10 minutos', 'Sin soltarte ni un segundo antes'],
    ['💐', 'Un ramo de peonías de verdad', 'O de hortensias, como tú quieras'],
    ['🎧', 'Tú pones la música en el carro', 'Alemán, Bizarrap o lo que se te antoje'],
    ['🌙', 'Una desvelada platicando', 'De esas de "nada más una horita"'],
    ['💋', '20 besos', 'Canjeables todos de una vez'],
    ['✨', 'Un "sí" a lo que quieras', 'Dentro de lo razonable 😅'],
  ];

  const $ = id => document.getElementById(id);
  const CLAVE = 'valesBlanca';
  const leer = () => { try { return JSON.parse(localStorage.getItem(CLAVE)) || []; } catch { return []; } };
  const guardar = u => { try { localStorage.setItem(CLAVE, JSON.stringify(u)); } catch {} };
  let usados = leer();
  let elegido = null;

  function pintar() {
    $('vales').innerHTML = VALES.map(([ico, titulo, detalle], i) => {
      const usado = usados.includes(i);
      return `<div class="vale${usado ? ' usado' : ''}" data-i="${i}" style="animation-delay:${i * 50}ms">
        <div class="talon">${ico}</div>
        <div class="cuerpo">
          <small>Vale por</small>
          <b>${titulo}</b>
          <span style="color:var(--texto-suave);font-size:.9rem">${detalle}</span>
          ${usado ? '' : `<button type="button" data-i="${i}">Canjear</button>`}
        </div>
        ${usado ? '<span class="sello">CANJEADO</span>' : ''}
      </div>`;
    }).join('');
  }

  $('vales').addEventListener('click', e => {
    const b = e.target.closest('button[data-i]');
    if (!b) return;
    elegido = +b.dataset.i;
    $('cTexto').textContent = `Vale por: ${VALES[elegido][1]}. Después mándame captura para cumplírtelo 😉`;
    $('fondo').hidden = false;
    $('cSi').focus();
  });
  $('cNo').onclick = () => { $('fondo').hidden = true; };
  $('fondo').addEventListener('click', e => { if (e.target === $('fondo')) $('fondo').hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('fondo').hidden = true; });
  $('cSi').onclick = () => {
    usados.push(elegido);
    guardar(usados);
    $('fondo').hidden = true;
    pintar();
  };

  // Mantener presionado un vale usado lo reactiva
  let presion = null;
  $('vales').addEventListener('pointerdown', e => {
    const v = e.target.closest('.vale.usado');
    if (!v) return;
    presion = setTimeout(() => {
      usados = usados.filter(i => i !== +v.dataset.i);
      guardar(usados);
      pintar();
    }, 1200);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => $('vales').addEventListener(ev, () => clearTimeout(presion)));

  pintar();
</script>
</body>
</html>
