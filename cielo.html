<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro cielo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap">
<link rel="stylesheet" href="comun.css">
<style>
  .mapa { width: 100%; max-width: 520px; aspect-ratio: 1; position: relative; }
  canvas { width: 100%; height: 100%; display: block; }
  .ficha { display: flex; flex-direction: column; gap: 4px; }
  .ficha .letra { font-size: 2rem; color: var(--texto); }
  .ficha small { letter-spacing: .18em; text-transform: uppercase; color: var(--texto-suave); font-weight: 600; font-size: .78rem; font-variant-numeric: tabular-nums; }
  .texto { line-height: 1.7; font-size: 1.05rem; text-align: left; }
  .texto b { color: var(--azul-suave); }
</style>
</head>
<body>
<main>
  <h1>Nuestro cielo</h1>
  <p class="sub">Así estaban las estrellas justo encima de nosotros cuando te pedí ser mi novia</p>
  <div class="mapa"><canvas id="cielo" role="img" aria-label="Mapa de estrellas del 19 de octubre de 2026 a las 12 de la noche"></canvas></div>
  <div class="ficha">
    <div class="letra">Blanca &amp; tu hombre</div>
    <small id="cuando"></small>
    <small id="donde"></small>
  </div>
  <div class="panel texto" id="texto"></div>
  <a class="volver" href="sorpresas.html">← Más sorpresas</a>
</main>

<script>
  // ✏️ Personaliza aquí: lugar y momento exacto
  const LUGAR = { nombre: 'Quintana Roo, México', lat: 21.16, lon: -86.85 };
  const MOMENTO = Date.UTC(2026, 9, 19, 5, 0, 0); // 19 oct 2026, 12:00 a. m. hora de Quintana Roo (UTC−5)

  // Estrellas brillantes: [ascensión recta (h), declinación (°), magnitud, nombre a mostrar]
  const E = {
    sirio: [6.752, -16.72, -1.46, 'Sirio'], adhara: [6.977, -28.97, 1.5], wezen: [7.140, -26.39, 1.83], mirzam: [6.378, -17.96, 1.98],
    canopo: [6.399, -52.70, -0.74, 'Canopo'], arturo: [14.261, 19.18, -0.05, 'Arturo'],
    vega: [18.616, 38.78, 0.03, 'Vega'], sheliak: [18.835, 33.36, 3.5], sulafat: [18.982, 32.69, 3.25],
    capella: [5.278, 46.00, 0.08, 'Capella'], menkalinan: [5.992, 44.95, 1.9], thetaAur: [5.995, 37.21, 2.6], hassaleh: [4.950, 33.17, 2.7],
    rigel: [5.242, -8.20, 0.13, 'Rigel'], betelgeuse: [5.919, 7.41, 0.5, 'Betelgeuse'], bellatrix: [5.419, 6.35, 1.64],
    alnilam: [5.604, -1.20, 1.69], alnitak: [5.679, -1.94, 1.77], mintaka: [5.533, -0.30, 2.23], saiph: [5.796, -9.67, 2.06], meissa: [5.585, 9.93, 3.4],
    procion: [7.655, 5.22, 0.34, 'Proción'], achernar: [1.629, -57.24, 0.46], altair: [19.846, 8.87, 0.76, 'Altair'],
    aldebaran: [4.599, 16.51, 0.86, 'Aldebarán'], elnath: [5.438, 28.61, 1.65], zetaTau: [5.627, 21.14, 3.0],
    thetaTau: [4.478, 15.87, 3.4], gammaTau: [4.330, 15.63, 3.65], deltaTau: [4.382, 17.54, 3.76], epsTau: [4.477, 19.18, 3.5],
    alcyone: [3.791, 24.11, 2.87], atlas: [3.819, 24.05, 3.62], electra: [3.747, 24.11, 3.7], maia: [3.763, 24.37, 3.87], merope: [3.772, 23.95, 4.18], taygeta: [3.753, 24.47, 4.3],
    antares: [16.490, -26.43, 1.06], espiga: [13.420, -11.16, 0.97], formalhaut: [22.961, -29.62, 1.16, 'Fomalhaut'],
    deneb: [20.690, 45.28, 1.25, 'Deneb'], sadr: [20.370, 40.26, 2.23], gienah: [20.770, 33.97, 2.48], deltaCyg: [19.750, 45.13, 2.87], albireo: [19.512, 27.96, 3.05],
    regulo: [10.139, 11.97, 1.35], pollux: [7.755, 28.03, 1.14, 'Pólux'], castor: [7.577, 31.89, 1.58, 'Cástor'], alhena: [6.629, 16.40, 1.93], mebsuta: [6.383, 25.13, 3.0], wasat: [7.335, 21.98, 3.5],
    dubhe: [11.062, 61.75, 1.79], merak: [11.031, 56.38, 2.37], phecda: [11.897, 53.69, 2.44], megrez: [12.257, 57.03, 3.31], alioth: [12.900, 55.96, 1.77], mizar: [13.399, 54.93, 2.23], alkaid: [13.792, 49.31, 1.86],
    polar: [2.530, 89.26, 1.98, 'Estrella Polar'],
    mirfak: [3.405, 49.86, 1.79], algol: [3.136, 40.96, 2.1], deltaPer: [3.715, 47.79, 3.0], gammaPer: [3.080, 53.51, 2.9],
    alpheratz: [0.140, 29.09, 2.06], mirach: [1.162, 35.62, 2.06], almach: [2.065, 42.33, 2.1],
    scheat: [23.063, 28.08, 2.42], markab: [23.079, 15.21, 2.49], algenib: [0.221, 15.18, 2.83], enif: [21.736, 9.88, 2.38], homam: [22.691, 10.83, 3.4],
    hamal: [2.120, 23.46, 2.0], sheratan: [1.911, 20.81, 2.64],
    schedar: [0.675, 56.54, 2.24], caph: [0.153, 59.15, 2.28], gammaCas: [0.945, 60.72, 2.47], ruchbah: [1.430, 60.24, 2.68], segin: [1.907, 63.67, 3.37],
    diphda: [0.727, -17.99, 2.04], menkar: [3.038, 4.09, 2.54],
  };

  // Constelaciones: nombre y líneas entre estrellas
  const C = [
    ['Orión', [['betelgeuse','bellatrix'],['betelgeuse','alnitak'],['bellatrix','mintaka'],['mintaka','alnilam'],['alnilam','alnitak'],['alnitak','saiph'],['mintaka','rigel'],['meissa','betelgeuse'],['meissa','bellatrix']]],
    ['Tauro', [['aldebaran','thetaTau'],['thetaTau','gammaTau'],['gammaTau','deltaTau'],['deltaTau','epsTau'],['epsTau','elnath'],['aldebaran','zetaTau']]],
    ['Pléyades', []],
    ['Géminis', [['castor','pollux'],['castor','mebsuta'],['pollux','wasat'],['wasat','alhena']]],
    ['Auriga', [['capella','menkalinan'],['menkalinan','thetaAur'],['thetaAur','elnath'],['elnath','hassaleh'],['hassaleh','capella']]],
    ['Casiopea', [['caph','schedar'],['schedar','gammaCas'],['gammaCas','ruchbah'],['ruchbah','segin']]],
    ['Perseo', [['gammaPer','mirfak'],['mirfak','deltaPer'],['mirfak','algol']]],
    ['Andrómeda', [['alpheratz','mirach'],['mirach','almach']]],
    ['Pegaso', [['alpheratz','scheat'],['scheat','markab'],['markab','algenib'],['algenib','alpheratz'],['markab','homam'],['homam','enif']]],
    ['Aries', [['hamal','sheratan']]],
    ['Cisne', [['deneb','sadr'],['sadr','albireo'],['gienah','sadr'],['sadr','deltaCyg']]],
    ['Lira', [['vega','sheliak'],['sheliak','sulafat'],['sulafat','vega']]],
    ['Osa Mayor', [['dubhe','merak'],['merak','phecda'],['phecda','megrez'],['megrez','dubhe'],['megrez','alioth'],['alioth','mizar'],['mizar','alkaid']]],
    ['Can Mayor', [['sirio','mirzam'],['sirio','adhara'],['adhara','wezen']]],
  ];
  const ANCLA = { 'Pléyades': 'alcyone' };

  const rad = Math.PI / 180;
  const JD = MOMENTO / 864e5 + 2440587.5;
  const GMST = ((18.697374558 + 24.06570982441908 * (JD - 2451545)) % 24 + 24) % 24;
  const LST = GMST + LUGAR.lon / 15;
  const sinLat = Math.sin(LUGAR.lat * rad), cosLat = Math.cos(LUGAR.lat * rad);

  function horizonte(ra, dec) {
    const H = (LST - ra) * 15 * rad, d = dec * rad;
    const alt = Math.asin(Math.sin(d) * sinLat + Math.cos(d) * cosLat * Math.cos(H));
    const az = Math.atan2(-Math.cos(d) * Math.sin(H), Math.sin(d) * cosLat - Math.cos(d) * sinLat * Math.cos(H));
    return { alt, az };
  }

  // Estrellas tenues de fondo (con semilla, siempre las mismas)
  let semilla = 1910;
  const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
  const tenues = [];
  for (let i = 0; i < 900; i++) {
    tenues.push([azar() * 24, Math.asin(azar() * 2 - 1) / rad, 4 + azar() * 2.6]);
  }

  const lienzo = document.getElementById('cielo');
  const ctx = lienzo.getContext('2d');
  let T = 0, CX = 0, R = 0, puntos = {}, fondo = [];

  function proyectar(ra, dec) {
    const { alt, az } = horizonte(ra, dec);
    if (alt < 0) return null;
    const r = R * Math.tan((Math.PI / 2 - alt) / 2);
    return { x: CX - r * Math.sin(az), y: CX - r * Math.cos(az), alt };
  }

  function medir() {
    const dpr = window.devicePixelRatio || 1;
    T = lienzo.clientWidth * dpr;
    lienzo.width = lienzo.height = T;
    CX = T / 2; R = T / 2 - T * 0.06;
    puntos = {};
    for (const k in E) { const p = proyectar(E[k][0], E[k][1]); if (p) puntos[k] = p; }
    fondo = tenues.map(([ra, dec, m]) => { const p = proyectar(ra, dec); return p && { ...p, m, fase: azar() * 6.28 }; }).filter(Boolean);
  }

  const tamano = m => Math.max(0.5, 2.9 - 0.5 * m) * T / 520;

  function dibujar(t) {
    ctx.clearRect(0, 0, T, T);
    // Cielo
    const g = ctx.createRadialGradient(CX, CX, 0, CX, CX, R);
    g.addColorStop(0, '#0d1630'); g.addColorStop(.75, '#081024'); g.addColorStop(1, '#0d1a3a');
    ctx.save();
    ctx.beginPath(); ctx.arc(CX, CX, R, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill(); ctx.clip();

    // Estrellas tenues
    for (const p of fondo) {
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(t / 900 + p.fase);
      ctx.fillStyle = '#cfdcff';
      ctx.beginPath(); ctx.arc(p.x, p.y, tamano(p.m), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Líneas de constelaciones
    ctx.strokeStyle = 'rgba(120,160,255,.45)';
    ctx.lineWidth = T / 520;
    for (const [, lineas] of C) {
      for (const [a, b] of lineas) {
        if (!puntos[a] || !puntos[b]) continue;
        ctx.beginPath(); ctx.moveTo(puntos[a].x, puntos[a].y); ctx.lineTo(puntos[b].x, puntos[b].y); ctx.stroke();
      }
    }

    // Estrellas brillantes
    for (const k in puntos) {
      const p = puntos[k], m = E[k][2], s = tamano(m);
      const brillo = 0.85 + 0.15 * Math.sin(t / 500 + k.length);
      if (m < 1.6) {
        const h = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, s * 5);
        h.addColorStop(0, `rgba(157,186,255,${.45 * brillo})`); h.addColorStop(1, 'rgba(157,186,255,0)');
        ctx.fillStyle = h; ctx.beginPath(); ctx.arc(p.x, p.y, s * 5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = brillo;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Nombres
    ctx.font = `600 ${Math.round(T / 46)}px Quicksand, sans-serif`;
    ctx.fillStyle = 'rgba(233,237,247,.8)';
    ctx.textAlign = 'left';
    for (const k in puntos) {
      const n = E[k][3];
      if (n) ctx.fillText(n, puntos[k].x + T / 90, puntos[k].y - T / 110);
    }
    ctx.font = `italic 600 ${Math.round(T / 40)}px Quicksand, sans-serif`;
    ctx.fillStyle = 'rgba(242,167,195,.85)';
    ctx.textAlign = 'center';
    for (const [nombre, lineas] of C) {
      const claves = ANCLA[nombre] ? [ANCLA[nombre]] : [...new Set(lineas.flat())];
      const vis = claves.map(k => puntos[k]).filter(Boolean);
      if (vis.length < Math.ceil(claves.length * .6)) continue;
      const x = vis.reduce((a, p) => a + p.x, 0) / vis.length;
      const y = Math.max(...vis.map(p => p.y)) + T / 28;
      ctx.fillText(nombre, x, y);
    }
    ctx.restore();

    // Borde y puntos cardinales
    ctx.strokeStyle = 'rgba(157,186,255,.6)'; ctx.lineWidth = T / 260;
    ctx.beginPath(); ctx.arc(CX, CX, R, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#9dbaff'; ctx.font = `700 ${Math.round(T / 34)}px Quicksand, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const m = T * 0.03;
    ctx.fillText('N', CX, m); ctx.fillText('S', CX, T - m);
    ctx.fillText('E', m, CX); ctx.fillText('O', T - m, CX);
    ctx.textBaseline = 'alphabetic';
  }

  function animar(t) {
    dibujar(t);
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(animar);
  }

  medir();
  requestAnimationFrame(animar);
  addEventListener('resize', medir);

  // Textos
  document.getElementById('cuando').textContent = '19 de octubre de 2026 · 12:00 de la noche';
  document.getElementById('donde').textContent = `${LUGAR.nombre} · ${Math.abs(LUGAR.lat).toFixed(2)}° N, ${Math.abs(LUGAR.lon).toFixed(2)}° O`;

  const visibles = C.map(([n, l]) => {
    const claves = ANCLA[n] ? [ANCLA[n]] : [...new Set(l.flat())];
    const alts = claves.map(k => horizonte(E[k][0], E[k][1]).alt / rad);
    return { n, alt: Math.max(...alts) };
  }).filter(c => c.alt > 12).map(c => c.n);
  const lista = visibles.length > 1 ? visibles.slice(0, -1).join(', ') + ' y ' + visibles.at(-1) : visibles[0];
  document.getElementById('texto').innerHTML =
    `Esa noche, mientras estábamos en el carro y te pedía ser mi novia, arriba de nosotros se veían <b>${lista}</b>.<br><br>` +
    `Las estrellas no sabían lo que estaba pasando ahí abajo, pero desde entonces este es mi cielo favorito. ` +
    `Cada vez que veas estas estrellas, acuérdate de que ahí empezó lo nuestro 🖤💙`;
</script>
</body>
</html>
