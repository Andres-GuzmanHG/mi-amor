<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atrapa las flores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap">
<link rel="stylesheet" href="comun.css">
<style>
  main { gap: 12px; padding-block: 20px 40px; }
  .marcador { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .marcador span { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 999px; padding: 6px 14px; }
  .marcador b { color: var(--azul-suave); }
  .zona {
    position: relative; width: min(100%, 440px, 52vh); aspect-ratio: 3 / 4;
    border: 1px solid var(--linea); border-radius: 18px; overflow: hidden;
    background: linear-gradient(#0b1226, #07080c);
    touch-action: none; user-select: none;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .capa {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; background: rgba(5,8,16,.86); text-align: center;
    animation: aparecer .4s ease both;
  }
  .capa h2 { font-size: 2.2rem; }
  .capa p { line-height: 1.6; max-width: 30ch; }
  .capa .frase { font-family: var(--display); font-size: 1.7rem; color: var(--peonia); line-height: 1.3; }
  .reglas { color: var(--texto-suave); font-size: .92rem; }
</style>
</head>
<body>
<main>
  <h1>Atrapa las flores</h1>
  <div class="marcador">
    <span>Nivel <b id="nivel">1</b>/3</span>
    <span>Flores <b id="puntos">0</b>/<b id="meta">10</b></span>
    <span id="vidas">💙💙💙</span>
  </div>
  <div class="zona" id="zona">
    <canvas id="lienzo"></canvas>
    <div class="capa" id="capa">
      <h2>¿Lista, Blanca?</h2>
      <p>Mueve la canasta para atrapar <b>peonías 🌸</b> y <b>hortensias 🪻</b>.</p>
      <p class="reglas">Esquiva la alarma ⏰ (la de cuando nos desvelamos) y la cebolla 🧅, que hace llorar.<br>Cada nivel desbloquea un recuerdo.</p>
      <button class="btn" id="empezar">Jugar</button>
    </div>
  </div>
  <p class="reglas">Arrastra con el dedo o usa las flechas ← →</p>
  <a class="volver" href="sorpresas.html">← Más sorpresas</a>
</main>

<script>
  // ✏️ Personaliza aquí: lo que se desbloquea en cada nivel
  const NIVELES = [
    { meta: 10, velocidad: 1, frase: 'Te vi y pensé: "wow, qué hermosa".' },
    { meta: 15, velocidad: 1.45, frase: 'Iba a quedarme una horita… y me desvelé platicando contigo.' },
    { meta: 20, velocidad: 1.9, frase: 'En el carro, a las 12 de la noche, me dijiste que sí.' },
  ];
  const FINAL = 'Ganaste el juego… y también a mí, desde hace rato. Te amo, mi niña preciosa 🖤💙';

  const $ = id => document.getElementById(id);
  const lienzo = $('lienzo'), ctx = lienzo.getContext('2d');
  let W, H, dpr;
  function medir() {
    dpr = window.devicePixelRatio || 1;
    W = lienzo.clientWidth; H = lienzo.clientHeight;
    lienzo.width = W * dpr; lienzo.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  medir();
  addEventListener('resize', medir);

  const BUENAS = ['🌸', '🪻', '💐', '💙'];
  const MALAS = ['⏰', '🧅'];
  let nivel = 0, puntos = 0, vidas = 3, cosas = [], canasta = { x: .5 }, jugando = false, ultimo = 0, siguiente = 0, teclas = {};

  function marcador() {
    $('nivel').textContent = nivel + 1;
    $('puntos').textContent = puntos;
    $('meta').textContent = NIVELES[nivel].meta;
    $('vidas').textContent = '💙'.repeat(vidas) + '🖤'.repeat(3 - vidas);
  }

  function capa(html) {
    $('capa').innerHTML = html;
    $('capa').hidden = false;
    $('capa').querySelector('button')?.focus();
  }

  function empezarNivel() {
    puntos = 0; cosas = []; siguiente = 0;
    $('capa').hidden = true;
    marcador();
    jugando = true;
    ultimo = performance.now();
    requestAnimationFrame(bucle);
  }

  function soltar() {
    const malo = Math.random() < 0.22 + nivel * 0.06;
    cosas.push({
      x: 0.08 + Math.random() * 0.84, y: -0.05,
      v: (0.18 + Math.random() * 0.12) * NIVELES[nivel].velocidad,
      e: malo ? MALAS[Math.floor(Math.random() * MALAS.length)] : BUENAS[Math.floor(Math.random() * BUENAS.length)],
      malo, giro: Math.random() * 6,
    });
  }

  function bucle(t) {
    if (!jugando) return;
    const dt = Math.min(0.05, (t - ultimo) / 1000); ultimo = t;
    if (teclas.ArrowLeft) canasta.x -= dt * 1.2;
    if (teclas.ArrowRight) canasta.x += dt * 1.2;
    canasta.x = Math.min(0.92, Math.max(0.08, canasta.x));

    siguiente -= dt;
    if (siguiente <= 0) { soltar(); siguiente = 0.75 / NIVELES[nivel].velocidad; }

    const cy = 0.9, ancho = 0.17;
    for (const c of cosas) {
      c.y += c.v * dt; c.giro += dt;
      if (!c.fin && c.y > cy - 0.04 && c.y < cy + 0.03 && Math.abs(c.x - canasta.x) < ancho / 2 + 0.03) {
        c.fin = true;
        if (c.malo) { vidas--; destello = { t: 0.3, color: 'rgba(255,90,110,' }; }
        else { puntos++; destello = { t: 0.25, color: 'rgba(79,134,255,' }; }
        marcador();
      }
    }
    cosas = cosas.filter(c => !c.fin && c.y < 1.1);
    pintar(dt);

    if (vidas <= 0) {
      jugando = false;
      capa(`<h2>¡Uy!</h2><p>Te ganaron las alarmas y las cebollas 😂<br>Pero yo sigo aquí, inténtalo otra vez.</p><button class="btn" id="otra">Intentar de nuevo</button>`);
      $('otra').onclick = () => { vidas = 3; empezarNivel(); };
    } else if (puntos >= NIVELES[nivel].meta) {
      jugando = false;
      const fraseNivel = NIVELES[nivel].frase;
      if (nivel === NIVELES.length - 1) {
        capa(`<h2>¡Ganaste! 🏆</h2><p class="frase">${fraseNivel}</p><p>${FINAL}</p><button class="btn" id="otra">Jugar otra vez</button>`);
        $('otra').onclick = () => { nivel = 0; vidas = 3; empezarNivel(); };
      } else {
        capa(`<h2>Nivel ${nivel + 1} superado</h2><p>Recuerdo desbloqueado:</p><p class="frase">${fraseNivel}</p><button class="btn" id="otra">Siguiente nivel →</button>`);
        $('otra').onclick = () => { nivel++; empezarNivel(); };
      }
    } else {
      requestAnimationFrame(bucle);
    }
  }

  let destello = null;
  function pintar(dt) {
    ctx.clearRect(0, 0, W, H);
    if (destello) {
      ctx.fillStyle = destello.color + (destello.t * 0.8) + ')';
      ctx.fillRect(0, 0, W, H);
      destello.t -= dt; if (destello.t <= 0) destello = null;
    }
    const tam = Math.round(W * 0.09);
    ctx.font = `${tam}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const c of cosas) {
      ctx.save();
      ctx.translate(c.x * W, c.y * H);
      ctx.rotate(Math.sin(c.giro * 2) * 0.3);
      ctx.fillText(c.e, 0, 0);
      ctx.restore();
    }
    // Canasta
    const cx = canasta.x * W, cy = 0.9 * H, a = W * 0.17, h = H * 0.05;
    ctx.fillStyle = '#4f86ff';
    ctx.beginPath();
    ctx.moveTo(cx - a / 2, cy - h / 2); ctx.lineTo(cx + a / 2, cy - h / 2);
    ctx.lineTo(cx + a * 0.38, cy + h / 2); ctx.lineTo(cx - a * 0.38, cy + h / 2); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#9dbaff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(cx, cy - h / 2, a / 2, h * 0.25, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.font = `${Math.round(h * 0.7)}px serif`;
    ctx.fillText('🖤', cx, cy + h * 0.05);
  }

  // Controles
  function moverA(clientX) {
    const r = lienzo.getBoundingClientRect();
    canasta.x = (clientX - r.left) / r.width;
  }
  $('zona').addEventListener('pointerdown', e => { if (jugando) moverA(e.clientX); });
  $('zona').addEventListener('pointermove', e => { if (jugando && (e.buttons || e.pointerType !== 'mouse')) moverA(e.clientX); });
  $('zona').addEventListener('mousemove', e => { if (jugando) moverA(e.clientX); });
  addEventListener('keydown', e => { if (e.key.startsWith('Arrow')) { teclas[e.key] = true; if (jugando) e.preventDefault(); } });
  addEventListener('keyup', e => { teclas[e.key] = false; });

  $('empezar').onclick = empezarNivel;
  marcador();
  pintar(0);
</script>
</body>
</html>
